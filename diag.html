<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mushafi bağlantı testi</title>
<style>
  body{background:#0a0c10;color:#f5e6be;font:14px/1.5 system-ui,sans-serif;margin:0;padding:16px;max-width:720px}
  h1{font-size:18px;margin:0 0 6px} p{color:#c9b98a;margin:6px 0 12px}
  button{background:#d49d35;color:#0a0c10;border:0;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;margin:0 8px 8px 0}
  button.sec{background:#222938;color:#f5e6be}
  pre{white-space:pre-wrap;word-break:break-word;background:#10141c;border:1px solid #222938;border-radius:12px;padding:12px;font-size:12px;min-height:80px}
</style>
</head>
<body>
<h1>Mushafi bağlantı testi</h1>
<p>Testi başlat, 30-60 saniye bekle. Bitince "Sonucu kopyala" de ve yazıyı sohbete yapıştır. Kişisel bilgi içermez.</p>
<button id="run">Testi başlat</button><button id="copy" class="sec">Sonucu kopyala</button>
<pre id="out">Hazır.</pre>
<script>
const PROXY = 'https://mushafi-proxy.obaroxdi.workers.dev';
const IDB_NAME = 'MushafiOfflineDB_v1', IDB_STORE = 'quran_pages', STATE_KEY = 'teheccut_quran_state_v1';
let lines = [];
function log(m) { lines.push(m); document.getElementById('out').textContent = lines.join('\n'); }

async function timed(url) {
    const t0 = performance.now(), ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 15000);
    try {
        const r = await fetch(url, { signal: ctrl.signal });
        clearTimeout(to);
        let body = null; try { body = await r.json(); } catch (e) {}
        return { ok: r.ok, status: r.status, ms: Math.round(performance.now() - t0), body };
    } catch (e) {
        clearTimeout(to);
        return { ok: false, status: 0, ms: Math.round(performance.now() - t0), err: (e && e.name === 'AbortError') ? '15 sn zaman aşımı' : String((e && e.message) || e) };
    }
}
const textUrl = p => `https://api.alquran.cloud/v1/page/${p}/editions/quran-uthmani`;
const layUrl = p => `${PROXY}/verses/by_page/${p}?words=true&word_fields=text_uthmani,line_number&per_page=50`;
function describe(r, kind) {
    if (r.status === 0) return `HATA ${r.err} (${r.ms} ms)`;
    let extra = '';
    if (r.body) {
        if (kind === 'text') extra = r.body.data ? ` ayet:${(Array.isArray(r.body.data) ? r.body.data[0] : r.body.data).ayahs?.length ?? '?'}` : ' veri yok';
        else extra = Array.isArray(r.body.verses) ? ` ayet:${r.body.verses.length}` : ' verses yok: ' + JSON.stringify(r.body).slice(0, 120);
    }
    return `${r.ok ? 'OK' : 'HATA'} HTTP ${r.status} (${r.ms} ms)${extra}`;
}

async function checkStorage() {
    try {
        const raw = localStorage.getItem(STATE_KEY);
        if (raw) { const st = JSON.parse(raw); log(`Kayıtlı veri: ${Math.round(raw.length / 1024)} KB, sayfa ${st.currentPage}, dil ${st.lang}`); }
        else log('Kayıtlı veri: yok');
    } catch (e) { log('Kayıtlı veri okunamadı: ' + e.message); }
    try {
        const db = await new Promise((res, rej) => { const q = indexedDB.open(IDB_NAME); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
        if (!db.objectStoreNames.contains(IDB_STORE)) { log('Çevrimdışı depo: boş (tablo yok)'); db.close(); return; }
        const all = await new Promise((res, rej) => { const q = db.transaction(IDB_STORE).objectStore(IDB_STORE).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => rej(q.error); });
        const noLayout = all.filter(x => !x.layout).map(x => x.page);
        log(`Çevrimdışı depo: ${all.length} sayfa kayıtlı, satır düzeni EKSİK olan: ${noLayout.length}${noLayout.length ? ' (örnek: ' + noLayout.slice(0, 8).join(',') + ')' : ''}`);
        db.close();
    } catch (e) { log('Çevrimdışı depo okunamadı: ' + (e && e.message || e)); }
}

async function runDiag() {
    lines = [];
    log('— Ortam —');
    log(`Tarayıcı: ${navigator.userAgent}`);
    log(`Adres: ${location.origin}${location.pathname} | internet: ${navigator.onLine ? 'var' : 'YOK'}`);
    try {
        if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            log(`Servis çalışanı: ${regs.length} kayıt, sayfayı denetliyor: ${navigator.serviceWorker.controller ? 'evet' : 'hayır'}`);
            const keys = await caches.keys(); log(`Önbellekler: ${keys.join(', ') || 'yok'}`);
        } else log('Servis çalışanı: desteklenmiyor');
    } catch (e) { log('Servis çalışanı okunamadı: ' + e.message); }
    await checkStorage();

    log('\n— Tek sayfa testi (sayfa 1) —');
    const a = await timed(textUrl(1)); log('Ana kaynak (alquran.cloud): ' + describe(a, 'text'));
    const b = await timed(layUrl(1)); log('Satır düzeni (Worker): ' + describe(b, 'layout'));

    log('\n— Art arda 10 sayfa (sırayla) —');
    const fails = { text: [], lay: [] }; let slowT = 0, slowL = 0;
    for (let p = 2; p <= 11; p++) {
        const x = await timed(textUrl(p)), y = await timed(layUrl(p));
        slowT = Math.max(slowT, x.ms); slowL = Math.max(slowL, y.ms);
        if (!x.ok) fails.text.push(`s${p}:${x.status || x.err}`);
        if (!y.ok) fails.lay.push(`s${p}:${y.status || y.err}`);
    }
    log(`Ana kaynak: ${10 - fails.text.length}/10 başarılı, en yavaş ${slowT} ms ${fails.text.length ? '| hatalar: ' + fails.text.join(' ') : ''}`);
    log(`Satır düzeni: ${10 - fails.lay.length}/10 başarılı, en yavaş ${slowL} ms ${fails.lay.length ? '| hatalar: ' + fails.lay.join(' ') : ''}`);

    log('\n— Aynı anda 6 istek (yoğunluk testi) —');
    const burst = await Promise.all([20, 21, 22, 23, 24, 25].map(p => timed(layUrl(p))));
    log('Worker: ' + burst.map((r, i) => `s${20 + i}:${r.ok ? 'OK' : (r.status || r.err)}`).join(' '));

    log('\n— Yorum —');
    const hints = [];
    const wBad = [b, ...burst].filter(r => !r.ok);
    if (b.status === 0) hints.push('Worker\'a hiç ulaşılamıyor: adres yanlış, Worker durmuş ya da CORS izni (Access-Control-Allow-Origin) eksik olabilir.');
    if ([b, ...burst].some(r => r.status === 401 || r.status === 403)) hints.push('Worker yetki hatası veriyor (401/403): Quran Foundation anahtarı/jetonu geçersiz ya da süresi dolmuş olabilir.');
    if ([b, ...burst].some(r => r.status === 429) || fails.lay.some(f => /429/.test(f))) hints.push('İstek limiti (429): Worker ya da kaynak çok istek aldığı için reddediyor.');
    if ([b, ...burst].some(r => r.status >= 500) || fails.lay.some(f => /:5\d\d/.test(f))) hints.push('Worker kendi içinde hata veriyor (5xx): Worker kodunun günlüklerine (Cloudflare → Workers → Logs) bakmak gerekir.');
    if (a.status === 0 || fails.text.length) hints.push('Ana kaynak (alquran.cloud) bazı isteklerde başarısız.');
    if (!hints.length && !wBad.length && a.ok) hints.push('Sunucular sağlıklı görünüyor; sorun tarayıcıdaki eski önbellek/depo ya da eski sürüm olabilir.');
    hints.forEach(h => log('• ' + h));
    log('\nBitti.');
}
document.getElementById('run').onclick = () => { document.getElementById('run').disabled = true; runDiag().finally(() => { document.getElementById('run').disabled = false; }); };
document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(lines.join('\n')); alert('Kopyalandı'); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); alert('Metni seçtim, elle kopyala'); }
};
</script>
</body>
</html>
